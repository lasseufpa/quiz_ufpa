# Sobe o quiz em container:
#
#   docker compose up --build
#
# Na primeira execução, abra http://localhost:5000/setup e defina a senha
# do professor. Depois use http://localhost:5000/host (apresentador) e
# http://localhost:5000/admin (administração).
# Para parar: Ctrl+C ou "docker compose down".

services:
  quiz:
    build: .
    image: quiz-ufpa
    container_name: quiz-ufpa

    # network_mode: host faz o container usar a rede da máquina. Assim o app
    # descobre o IP da rede local e mostra para os alunos o endereço certo
    # (funciona no Linux, que é onde o servidor costuma rodar).
    #
    # Alternativa (macOS/Windows, ou para isolar a rede) — troque a linha acima
    # por estas duas e ajuste QUIZ_HOST_IP logo abaixo:
    #   ports:
    #     - "5000:5000"
    network_mode: host

    environment:
      # Em container não queremos o auto-reload do modo debug
      FLASK_DEBUG: "0"

      # Em container não há navegador: a tela de configuração é aberta na mão
      QUIZ_OPEN_BROWSER: "0"

      # Nível dos logs: DEBUG, INFO, WARNING ou ERROR (padrão: INFO)
      QUIZ_LOG_LEVEL: "${QUIZ_LOG_LEVEL:-INFO}"

      # Porta do servidor (padrão 5000). Ex.: QUIZ_PORT=8080 docker compose up
      QUIZ_PORT: "${QUIZ_PORT:-5000}"

      # Use apenas no modo com portas mapeadas (veja acima): informe o IP da
      # máquina na rede local, senão os alunos recebem o IP interno do container.
      QUIZ_HOST_IP: "${QUIZ_HOST_IP:-}"

    volumes:
      # Tudo o que precisa sobreviver a uma recriação do container
      - ./.private:/app/.private                     # senhas, alunos, partida salva
      - ./scores:/app/scores                         # resultados em CSV
      - ./logs:/app/logs                             # logs do servidor
      - ./static/quizzes:/app/static/quizzes         # quizzes criados no editor
      - ./static/quiz-figures:/app/static/quiz-figures  # figuras das perguntas
      - ./static/graphs:/app/static/graphs           # gráficos gerados

    restart: unless-stopped
