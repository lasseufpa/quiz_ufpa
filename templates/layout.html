<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flask-Quiz{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* --- Reset Básico & Estilo Geral --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            /* Nova fonte */
            /* Fundo gradiente vibrante */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            /* Centraliza o conteúdo vertical e horizontalmente */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- O Cartão Principal --- */
        .container {
            width: 100%;
            max-width: 800px;
            /* "auto" nas duas direções centraliza quando o conteúdo cabe e
               NÃO corta quando ele é mais alto que a tela (ex.: placar final
               com muitos jogadores, que antes escondia o botão no rodapé). */
            margin: auto;
            background-color: #ffffff;
            border-radius: 16px;
            /* Mais arredondado */
            /* Sombra suave para dar profundidade */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 40px;
            /* Mais preenchimento */
            text-align: center;
            overflow: hidden;
            /* Para conter os elementos */
        }

        /* --- Títulos --- */
        h1 {
            color: #4a4a4a;
            font-weight: 700;
            margin-bottom: 0.5em;
        }

        h2 {
            color: #5a5a5a;
            font-weight: 700;
            margin-bottom: 1em;
        }

        h3 {
            white-space: pre-line;
            text-align: left;
            color: #333;
            font-weight: 700;
            font-size: 1.75rem;
            /* Título da pergunta maior */
            margin-bottom: 1.5rem;
            line-height: 1.4;
            
        }

        /* --- Botões Padrão & Inputs --- */
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 25px;
            /* Botões maiores */
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            /* Fonte maior */
            font-weight: 700;
            margin: 5px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            /* Efeito de "levantar" */
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* --- ★ SISTEMA DE BOTÕES (.btn) ★ ---
           Use .btn + uma variante de cor + opcionalmente um tamanho.
           Todas as páginas (editor, admin, host...) devem usar estas classes
           em vez de estilos inline, para manter tamanhos e espaçamentos iguais. */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 0;
            padding: 10px 20px;
            min-height: 46px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            background-color: #ccc;
            color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Tamanhos */
        .btn-sm {
            padding: 6px 12px;
            min-height: 34px;
            border-radius: 6px;
            font-size: 0.72rem;
            letter-spacing: 0.3px;
        }

        .btn-lg {
            padding: 14px 28px;
            min-height: 56px;
            font-size: 1rem;
        }

        /* Botão apenas com ícone (fechar modais, remover opção) */
        .btn-icon {
            width: 40px;
            height: 40px;
            min-height: 0;
            padding: 0;
            border-radius: 50%;
            font-size: 1rem;
            letter-spacing: 0;
            background-color: #f1f1f1;
            color: #555;
        }

        .btn-icon:hover:not(:disabled) {
            background-color: #e2e2e2;
            box-shadow: none;
        }

        /* Variantes de cor */
        .btn-primary   { background-color: #007bff; color: #fff; }
        .btn-success   { background-color: #28a745; color: #fff; }
        .btn-danger    { background-color: #dc3545; color: #fff; }
        .btn-warning   { background-color: #ffc107; color: #212529; }
        .btn-secondary { background-color: #6c757d; color: #fff; }
        .btn-info      { background-color: #17a2b8; color: #fff; }
        .btn-purple    { background-color: #6f42c1; color: #fff; }

        /* Agrupamentos */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        /* Linha de formulário (input/select + botão com a mesma altura) */
        .form-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .form-row input[type="text"],
        .form-row select {
            width: auto;
            min-width: 240px;
            height: 46px;
            margin-bottom: 0;
            padding: 0 14px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .form-row .btn {
            min-height: 46px;
        }

        /* Select padronizado (mesma altura dos botões) */
        .select-field {
            height: 46px;
            min-width: 240px;
            padding: 0 14px;
            font-family: inherit;
            font-size: 1rem;
            color: #333;
            background-color: #fff;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
        }

        .select-field:focus {
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.2);
            outline: none;
        }

        input[type="text"],
        input[type="password"] {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #ddd;
            width: 80%;
            max-width: 350px;
            margin-bottom: 15px;
            text-align: center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.2);
            outline: none;
        }

        /* --- ★ ESTILO DAS OPÇÕES DO QUIZ (O mais importante) ★ --- */
        .grid-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            /* Mais espaçamento */
            margin-top: 20px;
        }

        .option-btn {
            padding: 25px 20px;
            /* Botões de opção bem grandes */
            font-size: 1.3rem;
            /* Texto da opção grande */
            font-weight: 700;
            border: none;
            border-radius: 8px;
            color: white;
            /* Efeito de transição */
            transition: transform 0.2s ease, opacity 0.3s ease;
            min-height: 120px;
            /* Altura mínima */
            display: flex;
            align-items: center;
            justify-content: center;
            /* Rede de segurança: o flex descarta espaços entre filhos, então
               se a alternativa tiver mais de um elemento (rótulo + conteúdo)
               o gap mantém a separação. */
            gap: 0.4em;
            line-height: 1.3;
            min-width: 0;
            text-align: center;
        }

        /* Conteúdo da alternativa (texto + LaTeX + texto) em um único fluxo.
           O <span> é essencial: sem ele o MathJax insere irmãos soltos e, em
           um container flex, cada pedaço vira um item independente — a fórmula
           sai da caixa e as palavras ficam fora de ordem. */
        .option-btn > .option-content {
            display: block;
            max-width: 100%;
            overflow-wrap: break-word;
        }

        .option-btn:not(:disabled):hover {
            transform: scale(1.03);
            /* Efeito de "zoom" */
        }

        /* As cores no estilo Kahoot! */
        /* Usa :nth-child(4n+X) para ciclar as 4 cores */
        .option-btn:nth-child(4n+1) {
            background-color: #dc3545;
        }

        /* Vermelho */
        .option-btn:nth-child(4n+2) {
            background-color: #007bff;
        }

        /* Azul */
        .option-btn:nth-child(4n+3) {
            background-color: #ffc107;
        }

        /* Amarelo */
        .option-btn:nth-child(4n+4) {
            background-color: #28a745;
        }

        /* Verde */

        /* Quando um botão é clicado (o JS o desabilita) */
        .option-btn:disabled {
            opacity: 0.7;
            /* Esmaece os não selecionados */
            transform: none;
            background-color: #ccc !important;
            /* Cor padrão para desabilitado (importante para sobrepor) */
            color: #555 !important;
            box-shadow: none;
        }

        /* O JS do player.html (versão lock-step) aplica um style.backgroundColor
           no botão clicado. Esse style inline VAI sobrepor o :disabled,
           o que é ótimo! O botão clicado ficará azul e os outros cinzas. */

        /* --- Estilo da Lista de Jogadores (Lobby & Admin) --- */
        .player-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }

        .player-list li {
            background-color: #f1f1f1;
            margin: 8px 0;
            padding: 12px 15px;
            border-radius: 25px;
            /* Formato de "pílula" */
            font-weight: 700;
            color: #555;
            text-align: center;
        }

        /* --- Estilos de Resultado (Certo/Errado) --- */
        #result-view h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        #result-view #correct-answer-text {
            font-size: 1.2rem;
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #ddd;
        }

        /* --- Pódio/Placar Final --- */
        #final-score-list li:nth-child(1) {
            background-color: #fff3cd !important;
            font-size: 1.2em;
            font-weight: 700;
            border: 2px solid #ffeeba;
        }

        #final-score-list li:nth-child(2) {
            background-color: #e2e3e5 !important;
            border: 2px solid #d6d8db;
        }

        #final-score-list li:nth-child(3) {
            background-color: #ffe8cc !important;
            border: 2px solid #ffddb1;
        }

        /* --- Estilo da Contagem de Respostas (Host) --- */
        /* (Este seletor mira o <p> dentro da <div> #question-view) */
        #question-view p {
            font-size: 1.25rem;
            /* Aumenta o tamanho da fonte */
            font-weight: 700;
            /* Deixa em negrito */
            color: #555;
            margin-top: 2.5rem;
            /* Adiciona mais espaço acima */
            margin-bottom: 1.5rem;
            /* Adiciona espaço abaixo (antes do botão) */
        }

        /* --- Estilos do Admin (para os botões de editar/remover) --- */
        .user-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        .user-list-item:last-child {
            border-bottom: none;
        }

        .user-list-item .nickname-display,
        .user-list-item .edit-form {
            flex-grow: 1;
        }

        .user-list-item .edit-form input {
            width: 100%;
            height: 34px;
            padding: 0 10px;
            font-size: 0.95rem;
            border: 2px solid #ddd;
            border-radius: 6px;
        }

        .user-list-item .edit-form input:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.2);
            outline: none;
        }

        .user-list-item .actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        /* Variantes do painel de admin — reaproveitam o sistema .btn */
        .btn-edit {
            background-color: #ffc107;
            color: #212529;
        }

        .btn-remove {
            background-color: #dc3545;
            color: #fff;
        }

        .btn-save {
            background-color: #28a745;
            color: #fff;
        }

        .btn-cancel {
            background-color: #6c757d;
            color: #fff;
        }
        /* --- Tipografia de fórmulas (MathJax) ---
           O MathJax herda font-size, font-weight e text-decoration do elemento
           pai. Sem estes ajustes, fórmulas dentro de <button> (alternativas) e
           de <h3> (enunciados) ficavam com 160% do tamanho e em negrito,
           estourando a caixa e quebrando a fórmula no meio. */
        mjx-container {
            font-size: 1.05em !important;
            font-weight: normal !important;
            max-width: 100%;
        }

        /* Fórmulas em bloco ($$...$$) ficam centralizadas e, se forem mais
           largas que o cartão, rolam na horizontal em vez de vazar. */
        mjx-container[display="true"] {
            display: block;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 2px 0;
        }

        /* O MathJax insere <mjx-break> nos operadores para permitir quebra de
           linha, e esse elemento vem com white-space: normal. Resultado: em um
           enunciado/alternativa a fórmula era cortada no meio, por exemplo
           "(A^2/2)cos(ω" na primeira linha e "₀ℓ)" na segunda.
           Em fórmulas inline mantemos a fórmula inteira (o parágrafo é que
           quebra antes dela). Em bloco ($$...$$) as quebras continuam valendo. */
        mjx-container:not([display="true"]) mjx-break {
            white-space: nowrap !important;
        }
    </style>
    <!-- MathJax: a configuração precisa vir ANTES do carregamento da biblioteca -->
    <script>
    window.MathJax = {
        tex: {  
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
        },
        options: {
        ignoreHtmlClass: 'no-mathjax'
        },
        // No MathJax v4 as fontes são um pacote separado e, por padrão, vêm do
        // CDN. Aqui apontamos para a cópia local (ver "Escrever fórmulas
        // matemáticas" no README). Se a cópia local não existir, o carregador
        // abaixo remove esta seção e tudo volta a vir do CDN.
        chtml: {
        fontURL: '/static/@mathjax/mathjax-newcm-font/chtml/woff2',
        dynamicPrefix: '/static/@mathjax/mathjax-newcm-font/chtml/dynamic'
        }
    };
    </script>

    <!-- Carrega o MathJax: usa a cópia local (static/mathjax) se ela existir e,
         caso contrário, busca no CDN. Veja "Escrever fórmulas matemáticas"
         no README para habilitar o uso sem internet. -->
    <script>
    (function () {
        var CDN_SRC = 'https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js';

        function loadScript(src, onError) {
            var script = document.createElement('script');
            script.id = 'MathJax-script';
            script.async = true;
            script.src = src;
            if (onError) { script.onerror = onError; }
            document.head.appendChild(script);
            return script;
        }

        var local = loadScript("{{ url_for('static', filename='mathjax/tex-chtml.js') }}");
        local.onerror = function () {
            console.warn('MathJax local não encontrado; carregando do CDN.');
            // Sem a cópia local, as fontes também voltam para o CDN
            delete window.MathJax.chtml;
            local.remove();
            loadScript(CDN_SRC);
        };
    })();
    </script>
</head>

<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>

    <script>
        // Conecta ao servidor. 
        const socket = io(); 
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
