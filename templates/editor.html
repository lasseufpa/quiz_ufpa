{% extends "layout.html" %}
{% block title %}Editor de Quizzes{% endblock %}

{% block content %}
<style>
    .container {
        max-width: 1020px;
    }
    .quiz-editor {
        max-width: 900px;
        margin: 0 auto;
        padding: 0;
    }
    .quiz-selector {
        margin-bottom: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
    }
    .quiz-selector select {
        flex: 1 1 220px;
        min-width: 180px;
    }
    .editor-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
    }

    /* Barra de ferramentas do editor: mesma altura e mesma linguagem visual */
    .quiz-selector .btn,
    .editor-actions .btn {
        padding-left: 16px;
        padding-right: 16px;
        font-size: 0.85rem;
    }

    .figure-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-top: 6px;
    }
    .figure-row input[type="file"] {
        font-family: inherit;
        font-size: 0.85rem;
        color: #555;
    }
    /* Tempo de leitura da pergunta (fase entre o enunciado e as alternativas) */
    .reading-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin: 16px 0 4px;
    }
    .reading-row label {
        margin: 0;
        font-weight: 700;
        color: #555;
    }
    .reading-time,
    .answer-time {
        width: 92px;
        height: 36px;
        padding: 0 10px;
        font-family: inherit;
        font-size: 0.95rem;
        text-align: center;
        border: 2px solid #ddd;
        border-radius: 6px;
    }
    .reading-time:focus,
    .answer-time:focus {
        border-color: #007bff;
        box-shadow: 0 0 8px rgba(0, 123, 255, 0.2);
        outline: none;
    }
    .reading-hint {
        flex: 1 1 220px;
        color: #888;
        font-size: 0.72rem;
        text-align: left;
    }
    .add-option-btn {
        margin-top: 10px;
    }
    .btn-x {
        min-width: 34px;
        padding: 6px 0;
    }
    #quiz-form > label,
    .question-card > label {
        display: block;
        margin: 14px 0 6px;
        text-align: left;
        font-weight: 700;
        color: #555;
    }
    input.quiz-title-input {
        width: 100%;
        max-width: none;
        height: 46px;
        margin-bottom: 20px;
        padding: 0 14px;
        font-size: 1rem;
        text-align: left;
        border: 2px solid #ddd;
        border-radius: 8px;
    }
    input.quiz-title-input:focus {
        border-color: #007bff;
        box-shadow: 0 0 10px rgba(0, 123, 255, 0.2);
        outline: none;
    }
    .question-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        background: #f9f9f9;
        text-align: left;
    }
    .question-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }
    .question-header-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
    }
    .options-list {
        list-style: none;
        padding-left: 0;
    }
    .question-card textarea.question-text {
        width: 100%;
        padding: 10px 12px;
        font-family: inherit;
        font-size: 0.95rem;
        line-height: 1.45;
        border: 2px solid #ddd;
        border-radius: 6px;
        resize: vertical;
    }
    .question-card textarea.question-text:focus {
        border-color: #007bff;
        box-shadow: 0 0 8px rgba(0, 123, 255, 0.2);
        outline: none;
    }
    .options-list li {
        margin-bottom: 10px;
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .options-list input[type="radio"] {
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        margin: 0 2px 0 0;
        accent-color: #007bff;
        cursor: pointer;
    }
    .options-list textarea.option-text {
        flex: 1;
        min-height: 38px;
        padding: 8px 10px;
        font-family: inherit;
        font-size: 0.95rem;
        border: 2px solid #ddd;
        border-radius: 6px;
        resize: vertical;
    }
    .options-list textarea.option-text:focus {
        border-color: #007bff;
        box-shadow: 0 0 8px rgba(0, 123, 255, 0.2);
        outline: none;
    }
    .correct-option {
        width: 60px;
        padding: 5px;
    }
    .figure-preview {
        max-width: 150px;
        max-height: 150px;
        margin-top: 10px;
    }
    hr {
        margin: 30px 0;
    }

    /* Pré-visualização do quiz e modais */
    #preview-modal,
    #copy-modal,
    #class-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }
    #preview-modal.open,
    #copy-modal.open,
    #class-modal.open {
        display: flex;
    }
    .preview-dialog {
        background: #fff;
        width: 90%;
        max-width: 700px;
        max-height: 85vh;
        overflow: auto;
        padding: 25px;
        border-radius: 10px;
        text-align: center;
    }
    .preview-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }
    .preview-counter {
        font-weight: bold;
        color: #555;
    }
    .preview-close {
        flex-shrink: 0;
    }
    .preview-question-text {
        white-space: pre-wrap;
        text-align: left;
    }
    .preview-figure {
        display: block;
        max-width: 100%;
        margin: 15px auto;
    }
    .preview-options {
        display: grid;
        gap: 10px;
        margin: 20px 0;
        text-align: left;
    }
    .preview-option {
        border: 2px solid #ddd;
        border-radius: 8px;
        padding: 10px 15px;
        white-space: pre-wrap;
    }
    .preview-option.correct {
        border-color: #28a745;
        background: #e8f8ee;
    }
    .preview-letter {
        font-weight: bold;
        margin-right: 8px;
    }
    .preview-explanation {
        text-align: left;
        background: #f7f9fc;
        border-left: 4px solid #3b4cca;
        border-radius: 8px;
        padding: 10px 14px;
        margin: 0 0 16px;
        font-size: 0.95rem;
        line-height: 1.5;
        white-space: pre-wrap;
    }
    .preview-explanation p {
        margin: 6px 0 0;
    }
    .preview-nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 16px;
    }
    .preview-nav button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    .preview-field,
    input.preview-field,
    select.preview-field {
        width: 100%;
        max-width: none;
        height: 44px;
        margin: 6px 0 14px;
        padding: 0 12px;
        font-family: inherit;
        font-size: 1rem;
        text-align: left;
        border: 2px solid #ddd;
        border-radius: 8px;
        background-color: #fff;
    }
    .preview-field:focus,
    input.preview-field:focus,
    select.preview-field:focus {
        border-color: #007bff;
        box-shadow: 0 0 10px rgba(0, 123, 255, 0.2);
        outline: none;
    }
</style>

<div class="quiz-editor">
    <h1>Gerenciador de Quizzes</h1>

    <div class="quiz-selector">
        <label for="class-select" style="white-space: nowrap;">Turma:</label>
        <select id="class-select" class="select-field"></select>
        <div class="btn-group">
            <button id="new-class-btn" class="btn btn-warning">Nova turma</button>
            <button id="rename-class-btn" class="btn btn-warning">Renomear</button>
            <button id="delete-class-btn" class="btn btn-danger">Excluir turma</button>
        </div>
    </div>

    <div class="quiz-selector">
        <label for="quiz-select" style="white-space: nowrap;">Quiz:</label>
        <select id="quiz-select" class="select-field">
            <option value="">-- Novo Quiz --</option>
        </select>
        <div class="btn-group">
            <button id="new-quiz-btn" class="btn btn-warning">Novo</button>
            <button id="delete-quiz-btn" class="btn btn-danger">Excluir</button>
            <button id="copy-quiz-btn" class="btn btn-info">📥 Copiar de outra turma</button>
        </div>
    </div>

    <div id="quiz-form">
        <label for="quiz-title">Título do Quiz:</label>
        <input type="text" id="quiz-title" class="quiz-title-input" placeholder="Ex.: Funções do 1º grau">

        <div id="questions-container"></div>

        <div class="editor-actions">
            <button id="add-question-btn" class="btn btn-primary" title="Adicionar uma nova pergunta">+ Nova Pergunta</button>
            <button id="save-quiz-btn" class="btn btn-success">Salvar Quiz</button>
            <button id="export-quiz-btn" class="btn btn-info">📤 Exportar Quiz</button>
            <button id="import-quiz-btn" class="btn btn-secondary">📂 Importar Quiz</button>
            <button id="preview-quiz-btn" class="btn btn-purple" title="Pré-visualizar o quiz">👁 Prévia</button>
        </div>
        <input type="file" id="import-file-input" accept=".quiz" style="display: none;">
    </div>
</div>

<!-- Modal de pré-visualização (mesma visão de aluno/professor) -->
<div id="preview-modal">
    <div class="preview-dialog">
        <div class="preview-header">
            <span id="preview-counter" class="preview-counter"></span>
            <button id="preview-close-btn" class="btn btn-icon preview-close" title="Fechar">✕</button>
        </div>
        <h3 id="preview-question-text" class="preview-question-text"></h3>
        <img id="preview-figure" class="preview-figure" src="" alt="Figura da questão">
        <div id="preview-options" class="preview-options"></div>
        <div id="preview-explanation" class="preview-explanation" style="display: none;">
            <strong>Justificativa:</strong>
            <p id="preview-explanation-text"></p>
        </div>
        <div class="preview-nav">
            <button id="preview-prev-btn" class="btn btn-secondary">← Anterior</button>
            <button id="preview-next-btn" class="btn btn-primary">Próxima →</button>
        </div>
    </div>
</div>

<!-- Modal de cópia entre turmas -->
<div id="copy-modal">
    <div class="preview-dialog">
        <div class="preview-header">
            <span class="preview-counter">Copiar quiz de outra turma</span>
            <button id="copy-close-btn" class="btn btn-icon preview-close" title="Fechar">✕</button>
        </div>
        <div style="text-align: left;">
            <label for="copy-src-class">Turma de origem:</label>
            <select id="copy-src-class" class="preview-field"></select>

            <label for="copy-src-quiz">Quiz:</label>
            <select id="copy-src-quiz" class="preview-field"></select>

            <label for="copy-new-name">Salvar na turma atual como:</label>
            <input id="copy-new-name" type="text" class="preview-field">
        </div>
        <div class="preview-nav">
            <button id="copy-confirm-btn" class="btn btn-success">Copiar para esta turma</button>
        </div>
    </div>
</div>

<!-- Modal de turma (criar / renomear) -->
<div id="class-modal">
    <div class="preview-dialog" style="max-width: 460px;">
        <div class="preview-header">
            <span id="class-modal-title" class="preview-counter">Turma</span>
            <button id="class-close-btn" class="btn btn-icon preview-close" title="Fechar">✕</button>
        </div>
        <input id="class-name-input" type="text" placeholder="Nome da turma" class="preview-field">
        <div class="preview-nav">
            <button id="class-cancel-btn" class="btn btn-secondary">Cancelar</button>
            <button id="class-save-btn" class="btn btn-success">Salvar</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Tempos automáticos reais (vêm de routines/constants.py) para as dicas
    window.QUIZ_TIMING = {
        readingCharsPerSecond: {{ quiz_timing.reading_chars_per_second }},
        readingMinDuration: {{ quiz_timing.reading_min_duration }},
        readingMaxDuration: {{ quiz_timing.reading_max_duration }},
        readingMaxExplicit: {{ quiz_timing.reading_max_explicit }},
        answerCharsPerSecond: {{ quiz_timing.answer_chars_per_second }},
        answerMinDuration: {{ quiz_timing.answer_min_duration }},
        answerMaxDuration: {{ quiz_timing.answer_max_duration }},
        answerMaxExplicit: {{ quiz_timing.answer_max_explicit }}
    };
</script>
<script src="{{ url_for('static', filename='js/editor.js') }}"></script>
{% endblock %}
