{% extends "layout.html" %}
{% block title %}Editor de Quizzes{% endblock %}

{% block content %}
<style>
    .quiz-editor {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
    }
    .quiz-selector {
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .quiz-selector select {
        flex: 1;
        padding: 8px;
        font-size: 16px;
    }
    .question-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        background: #f9f9f9;
    }
    .question-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }
    .question-header-actions {
        display: flex;
        gap: 5px;
    }
    .options-list {
        list-style: none;
        padding-left: 0;
    }
    .options-list li {
        margin-bottom: 10px;
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .options-list input {
        flex: 1;
        padding: 5px;
    }
    .correct-option {
        width: 60px;
        padding: 5px;
    }
    .figure-preview {
        max-width: 150px;
        max-height: 150px;
        margin-top: 10px;
    }
    button {
        padding: 5px 12px;
        margin-right: 5px;
        cursor: pointer;
    }
    .btn-primary {
        background: #007bff;
        color: white;
        border: none;
        padding: 8px 16px;
    }
    .btn-danger {
        background: #dc3545;
        color: white;
        border: none;
    }
    .btn-warning {
        background: #ffc107;
        border: none;
    }
    hr {
        margin: 30px 0;
    }

    /* Pré-visualização do quiz e modais */
    #preview-modal,
    #copy-modal,
    #class-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }
    #preview-modal.open,
    #copy-modal.open,
    #class-modal.open {
        display: flex;
    }
    .preview-dialog {
        background: #fff;
        width: 90%;
        max-width: 700px;
        max-height: 85vh;
        overflow: auto;
        padding: 25px;
        border-radius: 10px;
        text-align: center;
    }
    .preview-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }
    .preview-counter {
        font-weight: bold;
        color: #555;
    }
    .preview-close {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        margin: 0;
    }
    .preview-question-text {
        white-space: pre-wrap;
        text-align: left;
    }
    .preview-figure {
        display: block;
        max-width: 100%;
        margin: 15px auto;
    }
    .preview-options {
        display: grid;
        gap: 10px;
        margin: 20px 0;
        text-align: left;
    }
    .preview-option {
        border: 2px solid #ddd;
        border-radius: 8px;
        padding: 10px 15px;
        white-space: pre-wrap;
    }
    .preview-option.correct {
        border-color: #28a745;
        background: #e8f8ee;
    }
    .preview-letter {
        font-weight: bold;
        margin-right: 8px;
    }
    .preview-nav button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>

<div class="quiz-editor">
    <h1>Gerenciador de Quizzes</h1>

    <div class="quiz-selector">
        <label for="class-select" style="white-space: nowrap;">Turma:</label>
        <select id="class-select"></select>
        <button id="new-class-btn" class="btn-warning">Nova turma</button>
        <button id="rename-class-btn" class="btn-warning">Renomear</button>
        <button id="delete-class-btn" class="btn-danger">Excluir turma</button>
    </div>

    <div class="quiz-selector">
        <label for="quiz-select" style="white-space: nowrap;">Quiz:</label>
        <select id="quiz-select">
            <option value="">-- Novo Quiz --</option>
        </select>
        <button id="new-quiz-btn" class="btn-warning">Novo</button>
        <button id="delete-quiz-btn" class="btn-danger">Excluir</button>
        <button id="copy-quiz-btn" style="background:#17a2b8; color:white; border:none;">📥 Copiar de outra turma</button>
    </div>

    <div id="quiz-form">
        <label>Título do Quiz:</label>
        <input type="text" id="quiz-title" style="width: 100%; margin-bottom: 20px; padding: 8px;">

        <div id="questions-container"></div>

        <button id="add-question-btn" class="btn-primary">+ Adicionar Pergunta</button>
        <button id="save-quiz-btn" style="background: #28a745; color: white; border: none; padding: 10px 20px; margin-left: 10px;">Salvar Quiz</button>
        <button id="export-quiz-btn" style="background: #17a2b8; color: white; border: none; padding: 10px 20px; margin-left: 10px;">📤 Exportar Quiz</button>
        <button id="import-quiz-btn" style="background: #6c757d; color: white; border: none; padding: 10px 20px; margin-left: 10px;">📂 Importar Quiz</button>
        <button id="preview-quiz-btn" style="background: #6f42c1; color: white; border: none; padding: 10px 20px; margin-left: 10px;">👁 Pré-visualizar</button>
        <input type="file" id="import-file-input" accept=".quiz" style="display: none;">
    </div>
</div>

<!-- Modal de pré-visualização (mesma visão de aluno/professor) -->
<div id="preview-modal">
    <div class="preview-dialog">
        <div class="preview-header">
            <span id="preview-counter" class="preview-counter"></span>
            <button id="preview-close-btn" class="preview-close" title="Fechar">✕</button>
        </div>
        <h3 id="preview-question-text" class="preview-question-text"></h3>
        <img id="preview-figure" class="preview-figure" src="" alt="Figura da questão">
        <div id="preview-options" class="preview-options"></div>
        <div class="preview-nav">
            <button id="preview-prev-btn">← Anterior</button>
            <button id="preview-next-btn">Próxima →</button>
        </div>
    </div>
</div>

<!-- Modal de cópia entre turmas -->
<div id="copy-modal">
    <div class="preview-dialog">
        <div class="preview-header">
            <span class="preview-counter">Copiar quiz de outra turma</span>
            <button id="copy-close-btn" class="preview-close" title="Fechar">✕</button>
        </div>
        <div style="text-align: left;">
            <label for="copy-src-class">Turma de origem:</label>
            <select id="copy-src-class" style="width: 100%; padding: 8px; margin: 6px 0 14px;"></select>

            <label for="copy-src-quiz">Quiz:</label>
            <select id="copy-src-quiz" style="width: 100%; padding: 8px; margin: 6px 0 14px;"></select>

            <label for="copy-new-name">Salvar na turma atual como:</label>
            <input id="copy-new-name" type="text" style="width: 100%; padding: 8px; margin: 6px 0 14px;">
        </div>
        <div class="preview-nav">
            <button id="copy-confirm-btn" style="background: #28a745; color: white; border: none;">Copiar para esta turma</button>
        </div>
    </div>
</div>

<!-- Modal de turma (criar / renomear) -->
<div id="class-modal">
    <div class="preview-dialog" style="max-width: 460px;">
        <div class="preview-header">
            <span id="class-modal-title" class="preview-counter">Turma</span>
            <button id="class-close-btn" class="preview-close" title="Fechar">✕</button>
        </div>
        <input id="class-name-input" type="text" placeholder="Nome da turma"
               style="width: 100%; padding: 10px; font-size: 16px; margin-bottom: 16px;">
        <div class="preview-nav">
            <button id="class-cancel-btn">Cancelar</button>
            <button id="class-save-btn" style="background: #28a745; color: white; border: none;">Salvar</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/editor.js') }}"></script>
{% endblock %}
