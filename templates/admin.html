{% extends "layout.html" %}
{% block title %}Admin - Gerenciar Usuários{% endblock %}

{% block content %}
<a href="{{ url_for('admin_logout') }}" style="float: right; color: #dc3545; text-decoration: none;">
    Sair (Logout)
</a>

<h1>Painel de Administração</h1>
<p>Gerencie os alunos que podem participar dos quizzes, turma por turma.</p>

<div id="class-selector" style="margin-bottom: 20px;">
    <label for="class-select">Turma:</label>
    <select id="class-select" class="select-field">
        <option value="">Carregando...</option>
    </select>
</div>

<div id="add-user-form" class="form-row" style="margin-bottom: 10px;">
    <input type="text" id="nickname-input" placeholder="Nome do novo jogador">
    <button id="add-btn" class="btn btn-primary">Adicionar</button>
</div>

<hr style="margin: 30px 0;">

<h2>Usuários Cadastrados</h2>

<ul id="user-list" class="player-list" style="max-width: 500px; margin: auto; text-align: left; padding: 0;">
</ul>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
