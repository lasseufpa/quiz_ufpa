{% extends "layout.html" %}
{% block title %}Admin - Gerenciar Usuários{% endblock %}

{% block content %}
<style>
    .user-list-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border-bottom: 1px solid #eee;
    }

    .user-list-item:last-child {
        border-bottom: none;
    }

    .user-list-item .nickname-display,
    .user-list-item .edit-form {
        flex-grow: 1;
    }

    .user-list-item .edit-form input {
        font-size: 16px;
        padding: 5px;
        border: 1px solid #007bff;
        border-radius: 4px;
    }

    .user-list-item .actions button {
        margin-left: 5px;
        padding: 5px 10px;
        font-size: 12px;
    }

    .btn-edit {
        background-color: #ffc107;
        color: black;
    }

    .btn-remove {
        background-color: #dc3545;
        color: white;
    }

    .btn-save {
        background-color: #28a745;
        color: white;
    }

    .btn-cancel {
        background-color: #6c757d;
        color: white;
    }
</style>

<a href="{{ url_for('admin_logout') }}" style="float: right; color: #dc3545; text-decoration: none;">
    Sair (Logout)
</a>

<h1>Painel de Administração</h1>
<p>Gerencie os usuários que podem participar dos quizzes.</p>

<div id="add-user-form">
    <input type="text" id="nickname-input" placeholder="Nome do novo jogador" style="width: 250px;">
    <button id="add-btn">Adicionar</button>
</div>

<hr style="margin: 30px 0;">

<h2>Usuários Cadastrados</h2>

<ul id="user-list" class="player-list" style="max-width: 500px; margin: auto; text-align: left; padding: 0;">
</ul>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
